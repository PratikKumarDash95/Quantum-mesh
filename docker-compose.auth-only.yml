version: "3.9"

networks:
  quantummesh:
    driver: bridge

volumes:
  postgres_data:
  redis_data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: qm-postgres
    environment:
      POSTGRES_DB: quantummesh
      POSTGRES_USER: quantum
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [quantummesh]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantum"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: qm-redis
    ports: ["6379:6379"]
    volumes: [redis_data:/data]
    networks: [quantummesh]

  config-server:
    build: ./config-server
    container_name: qm-config
    ports: ["8888:8888"]
    environment:
      EUREKA_HOST: discovery-service
    networks: [quantummesh]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  discovery-service:
    build: ./discovery-service
    container_name: qm-discovery
    ports: ["8761:8761"]
    environment:
      EUREKA_HOSTNAME: discovery-service
    networks: [quantummesh]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  auth-service:
    build: ./auth-service
    container_name: qm-auth
    depends_on:
      config-server: { condition: service_healthy }
      discovery-service: { condition: service_healthy }
      postgres: { condition: service_healthy }
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_HOST: discovery-service
      DB_URL: jdbc:postgresql://postgres:5432/quantummesh
      DB_USER: quantum
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_DRIVER: org.postgresql.Driver
      DB_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://localhost:9411/api/v2/spans
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "0.0"
    ports: ["8081:8081"]
    networks: [quantummesh]

  gateway-service:
    build: ./gateway-service
    container_name: qm-gateway
    depends_on:
      discovery-service: { condition: service_healthy }
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_HOST: discovery-service
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      AI_ENGINE_HOST: localhost
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://localhost:9411/api/v2/spans
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "0.0"
    ports: ["8080:8080"]
    networks: [quantummesh]

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: qm-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks: [quantummesh]

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: qm-kafka
    depends_on: [zookeeper]
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks: [quantummesh]

  analytics-service:
    build: ./analytics-service
    container_name: qm-analytics
    depends_on:
      kafka: { condition: service_started }
      discovery-service: { condition: service_healthy }
      config-server: { condition: service_healthy }
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_HOST: discovery-service
      KAFKA_BOOTSTRAP: kafka:29092
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://localhost:9411/api/v2/spans
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "0.0"
    ports: ["8083:8083"]
    networks: [quantummesh]

  notification-service:
    build: ./notification-service
    container_name: qm-notification
    depends_on:
      kafka: { condition: service_started }
      discovery-service: { condition: service_healthy }
      config-server: { condition: service_healthy }
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_HOST: discovery-service
      KAFKA_BOOTSTRAP: kafka:29092
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://localhost:9411/api/v2/spans
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "0.0"
    ports: ["8084:8084"]
    networks: [quantummesh]

  frontend:
    build: ./frontend-dashboard
    container_name: qm-frontend
    depends_on: [gateway-service]
    ports: ["3000:80"]
    networks: [quantummesh]

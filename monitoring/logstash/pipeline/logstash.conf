# QuantumMesh log pipeline.
# Spring Boot services ship structured JSON over TCP via LogstashTcpSocketAppender.
# We accept the JSON, normalize a few fields, and write to per-service daily
# indices in Elasticsearch.

input {
  tcp {
    port => 5044
    codec => json_lines
  }
}

filter {
  # Default the service name when the appender didn't set it.
  if ![service] {
    mutate { add_field => { "service" => "unknown" } }
  }

  # Promote MDC trace/correlation fields to top-level for easier Kibana search.
  if [mdc][traceId] {
    mutate { add_field => { "traceId" => "%{[mdc][traceId]}" } }
  }
  if [mdc][correlationId] {
    mutate { add_field => { "correlationId" => "%{[mdc][correlationId]}" } }
  }

  # Drop noisy actuator probes from the index (still visible in container logs).
  if [message] =~ /actuator\/health/ and [level] == "DEBUG" {
    drop {}
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "quantummesh-%{service}-%{+YYYY.MM.dd}"
  }
}

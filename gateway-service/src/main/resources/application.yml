server:
  port: 8080

spring:
  application:
    name: gateway-service

  config:
    import: optional:configserver:http://qm-config:8888

  main:
    web-application-type: reactive
    allow-bean-definition-overriding: true

  data:
    redis:
      host: redis
      port: 6379
      timeout: 1500ms

  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://qm-auth:8081
          predicates:
            - Path=/api/v1/auth/**

        - id: monitoring-service
          uri: http://qm-monitoring:8082
          predicates:
            - Path=/api/v1/monitoring/**

        - id: analytics-service
          uri: http://qm-analytics:8083
          predicates:
            - Path=/api/v1/analytics/**

        - id: notification-service
          uri: http://qm-notification:8084
          predicates:
            - Path=/api/v1/notifications/**

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders: "*"
            allowCredentials: true

      httpclient:
        connect-timeout: 2000
        response-timeout: 5s

quantummesh:
  jwt:
    secret: change-me-please-use-a-long-random-secret-key-32bytes-min

  rate-limit:
    enabled: true

  chaos:
    enabled: false

  cache:
    jwt:
      enabled: true
      ttl-seconds: 300

eureka:
  client:
    service-url:
      defaultZone: http://qm-discovery:8761/eureka/

  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus
          - gateway
          - chaos

  endpoint:
    health:
      show-details: always

    gateway:
      access: unrestricted

  tracing:
    sampling:
      probability: 1.0

  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.quantummesh.gateway: INFO
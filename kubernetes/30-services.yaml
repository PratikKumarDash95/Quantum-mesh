apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitoring-service
  namespace: quantummesh
spec:
  replicas: 1
  selector:
    matchLabels:
      app: monitoring-service
  template:
    metadata:
      labels:
        app: monitoring-service
    spec:
      containers:
        - name: monitoring
          image: quantummesh/monitoring-service:1.0.0
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: quantummesh-config
---
apiVersion: v1
kind: Service
metadata:
  name: monitoring-service
  namespace: quantummesh
spec:
  selector:
    app: monitoring-service
  ports:
    - port: 8082
      targetPort: 8082
---

version: "3.9"

networks:
  quantummesh:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  es_data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: qm-postgres
    environment:
      POSTGRES_DB: quantummesh
      POSTGRES_USER: quantum
      POSTGRES_PASSWORD: quantum
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [quantummesh]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantum"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: qm-redis
    ports: ["6379:6379"]
    volumes: [redis_data:/data]
    networks: [quantummesh]

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: qm-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks: [quantummesh]

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: qm-kafka
    depends_on: [zookeeper]
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks: [quantummesh]

  config-server:
    build: ./config-server
    container_name: qm-config
    ports: ["8888:8888"]
    networks: [quantummesh]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  discovery-service:
    build: ./discovery-service
    container_name: qm-discovery
    ports: ["8761:8761"]
    environment:
      EUREKA_HOSTNAME: discovery-service
    networks: [quantummesh]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  auth-service:
    build: ./auth-service
    container_name: qm-auth
    depends_on:
      config-server: { condition: service_healthy }
      discovery-service: { condition: service_healthy }
      postgres: { condition: service_healthy }
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-service:8761/eureka/
      EUREKA_HOST: discovery-service
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      DB_URL: jdbc:postgresql://postgres:5432/quantummesh
      DB_USER: quantum
      DB_PASSWORD: quantum
      DB_DRIVER: org.postgresql.Driver
      DB_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      JWT_SECRET: change-me-please-use-a-long-random-secret-key-32bytes-min
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_PROFILES_ACTIVE: postgres,elk
      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: 5044
    ports: ["8081:8081"]
    networks: [quantummesh]

  gateway-service:
    build: ./gateway-service
    container_name: qm-gateway
    depends_on:
      discovery-service: { condition: service_healthy }
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-service:8761/eureka/
      EUREKA_HOST: discovery-service
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      JWT_SECRET: change-me-please-use-a-long-random-secret-key-32bytes-min
      AI_ENGINE_HOST: ai-engine
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPRING_PROFILES_ACTIVE: elk
      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: 5044
    ports: ["8080:8080"]
    networks: [quantummesh]

  monitoring-service:
    build: ./monitoring-service
    container_name: qm-monitoring
    depends_on:
      discovery-service: { condition: service_healthy }
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-service:8761/eureka/
      EUREKA_HOST: discovery-service
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      SPRING_PROFILES_ACTIVE: elk
      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: 5044
    ports: ["8082:8082"]
    networks: [quantummesh]

  analytics-service:
    build: ./analytics-service
    container_name: qm-analytics
    depends_on:
      kafka: { condition: service_started }
      discovery-service: { condition: service_healthy }
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-service:8761/eureka/
      EUREKA_HOST: discovery-service
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      KAFKA_BOOTSTRAP: kafka:29092
      SPRING_PROFILES_ACTIVE: elk
      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: 5044
    ports: ["8083:8083"]
    networks: [quantummesh]

  notification-service:
    build: ./notification-service
    container_name: qm-notification
    depends_on:
      kafka: { condition: service_started }
      discovery-service: { condition: service_healthy }
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-service:8761/eureka/
      KAFKA_BOOTSTRAP: kafka:29092
      SPRING_PROFILES_ACTIVE: elk
      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: 5044
    ports: ["8084:8084"]
    networks: [quantummesh]

  ai-engine:
    build: ./ai-engine
    container_name: qm-ai
    ports: ["8000:8000"]
    networks: [quantummesh]

  frontend:
    build: ./frontend-dashboard
    container_name: qm-frontend
    depends_on: [gateway-service, monitoring-service]
    ports: ["3000:80"]
    networks: [quantummesh]

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: qm-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports: ["9090:9090"]
    networks: [quantummesh]

  grafana:
    image: grafana/grafana:11.2.0
    container_name: qm-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
    ports: ["3001:3000"]
    networks: [quantummesh]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: qm-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      bootstrap.memory_lock: "true"
    ulimits:
      memlock: { soft: -1, hard: -1 }
    volumes: [es_data:/usr/share/elasticsearch/data]
    ports: ["9200:9200"]
    networks: [quantummesh]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health | grep -E '\"status\":\"(yellow|green)\"'"]
      interval: 10s
      timeout: 5s
      retries: 20

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.0
    container_name: qm-logstash
    depends_on:
      elasticsearch: { condition: service_healthy }
    environment:
      LS_JAVA_OPTS: "-Xms256m -Xmx256m"
    volumes:
      - ./monitoring/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./monitoring/logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
    ports: ["5044:5044"]
    networks: [quantummesh]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9600/_node/pipelines | grep -q '\"main\"' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: qm-kibana
    depends_on:
      elasticsearch: { condition: service_healthy }
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports: ["5601:5601"]
    networks: [quantummesh]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5601/api/status | grep -q '\"level\":\"available\"' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
